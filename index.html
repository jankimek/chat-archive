<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Lora:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Firebase (global leaderboard). Safe to keep even if unconfigured. -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{
            --bg:#0a0a0a;--bg2:#111;--card:#161616;
            --accent:#d4a03c;--accent-h:#b8862e;--accent-glow:rgba(212,160,60,.08);
            --fg:#e4e4e4;--fg2:#b0b0b0;--muted:#6a6a6a;
            --border:#232323;--err:#d94444;--ok:#3ecf8e;--rad:12px;
            --dot-opacity:.015;
            --font:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif
        }
        :root.light{
            --bg:#f5f3ef;--bg2:#eae7e1;--card:#ffffff;
            --accent:#b8862e;--accent-h:#9a6f24;--accent-glow:rgba(184,134,46,.1);
            --fg:#1a1a1a;--fg2:#444;--muted:#888;
            --border:#d8d4ce;--err:#c03030;--ok:#1f9d64;
            --dot-opacity:.04
        }
        :root[data-accent="emerald"]{--accent:#3ecf8e;--accent-h:#2ba86f;--accent-glow:rgba(62,207,142,.09)}
        :root[data-accent="azure"]{--accent:#4db8ff;--accent-h:#2f97dd;--accent-glow:rgba(77,184,255,.09)}
        :root[data-accent="rose"]{--accent:#ef6f8f;--accent-h:#cc4d75;--accent-glow:rgba(239,111,143,.09)}
        :root[data-accent="violet"]{--accent:#a98bff;--accent-h:#8a63e8;--accent-glow:rgba(169,139,255,.09)}

        body{
            font-family:var(--font);
            background:var(--bg);color:var(--fg);
            height:100vh;height:100dvh;overflow:hidden;
            transition:background .3s,color .3s;
            overscroll-behavior:none
        }

        /* === PASSWORD SCREEN === */
        #pw-screen{
            position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
            background:var(--bg);z-index:100;padding:20px;
            transition:background .3s
        }
        #pw-screen::before{
            content:'';position:absolute;width:420px;height:420px;border-radius:50%;
            background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);
            top:18%;left:50%;transform:translateX(-50%);pointer-events:none
        }
        .pw-card{
            position:relative;background:var(--card);border:1px solid var(--border);
            border-radius:20px;padding:40px 28px 32px;width:100%;max-width:380px;
            text-align:center;
            box-shadow:0 0 80px var(--accent-glow),0 24px 64px rgba(0,0,0,.5);
            animation:cardIn .5s ease;transition:background .3s,border-color .3s
        }
        @keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
        .lock-wrap{
            width:60px;height:60px;border:2px solid var(--accent);border-radius:50%;
            display:flex;align-items:center;justify-content:center;margin:0 auto 24px;
            color:var(--accent);background:var(--accent-glow)
        }
        .pw-card h1{font-size:24px;font-weight:700;margin-bottom:8px;letter-spacing:-.3px}
        .pw-card .sub{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:28px}
        .inp-wrap{position:relative;margin-bottom:8px}
        .inp-wrap input{
            width:100%;padding:14px 48px 14px 16px;background:var(--bg);
            border:1.5px solid var(--border);border-radius:var(--rad);color:var(--fg);
            font-size:15px;font-family:inherit;outline:none;
            transition:border-color .2s,background .3s,color .3s
        }
        .inp-wrap input:focus{border-color:var(--accent)}
        .inp-wrap input.shake{border-color:var(--err);animation:shake .4s ease}
        @keyframes shake{
            0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}
            40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
        }
        .eye-btn{
            position:absolute;right:4px;top:50%;transform:translateY(-50%);
            width:40px;height:40px;display:flex;align-items:center;justify-content:center;
            background:none;border:none;color:var(--muted);cursor:pointer;border-radius:8px
        }
        .eye-btn:active{color:var(--fg)}
        .fld-err{color:var(--err);font-size:13px;min-height:28px;line-height:28px;text-align:left;padding-left:4px}
        .go-btn{
            width:100%;padding:14px;background:var(--accent);color:#0a0a0a;border:none;
            border-radius:var(--rad);font-size:15px;font-weight:700;font-family:inherit;
            cursor:pointer;transition:background .15s,transform .1s;margin-top:4px
        }
        .go-btn:active{transform:scale(.97);background:var(--accent-h)}
        .go-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
        .go-btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--fg);margin-top:10px}
        .go-btn.ghost:active{background:var(--bg2)}
        .link-btn{background:none;border:none;color:var(--muted);margin-top:16px;font-size:13px;cursor:pointer;text-decoration:underline;font-family:inherit}
        .link-btn:active{color:var(--fg)}

        /* === RESUME READING MODAL === */
        #resume-modal{
            position:fixed;inset:0;display:none;align-items:center;justify-content:center;
            background:rgba(0,0,0,.6);z-index:95;padding:20px;backdrop-filter:blur(4px)
        }
        #resume-modal .pw-card{max-width:340px;padding:32px 24px 28px}
        #resume-modal .r-ico{
            width:52px;height:52px;border:2px solid var(--accent);border-radius:50%;
            display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
            color:var(--accent);background:var(--accent-glow)
        }

        /* === LOADING SCREEN === */
        #ld-screen{
            position:fixed;inset:0;display:none;flex-direction:column;
            align-items:center;justify-content:center;background:var(--bg);z-index:90;
            transition:background .3s
        }
        .sp{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:24px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .ld-txt{font-size:15px;font-weight:500;color:var(--fg2)}
        .ld-det{font-size:12px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}

        /* === CHAT VIEW === */
        #chat-view{display:none;flex-direction:column;height:100vh;height:100dvh}
        .ch-hdr{
            flex-shrink:0;background:var(--bg2);border-bottom:1px solid var(--border);
            padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));
            display:flex;align-items:center;gap:12px;z-index:10;position:relative;
            transition:background .3s,border-color .3s
        }
        .hdr-icon{
            width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent-h));
            border-radius:10px;display:flex;align-items:center;justify-content:center;
            flex-shrink:0;color:#0a0a0a
        }
        .hdr-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
        .hdr-info h2{font-size:15px;font-weight:700;letter-spacing:-.2px}

        #hdr-meta {
            background:transparent;border:1px solid transparent;color:var(--muted);
            font-size:12px;font-family:inherit;width:80px;padding:2px 4px;border-radius:4px;
            outline:none;-moz-appearance:textfield;transition:border-color .2s,color .3s;
        }
        #hdr-meta::-webkit-outer-spin-button,
        #hdr-meta::-webkit-inner-spin-button {-webkit-appearance:none;margin:0}
        #hdr-meta:focus {border-color:var(--accent);color:var(--fg)}

        .progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none}
        #prog-fill{height:100%;width:0;background:var(--accent);transition:width .2s;opacity:.85}

        .theme-btn{
            width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
            background:var(--card);display:flex;align-items:center;justify-content:center;
            cursor:pointer;color:var(--fg);flex-shrink:0;
            transition:background .2s,border-color .2s,transform .1s
        }
        .theme-btn:active{transform:scale(.9)}
        .ch-scroll{
            flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
            padding:10px 10px 20px;display:flex;flex-direction:column;gap:10px;
            background-image:radial-gradient(circle,rgba(255,255,255,var(--dot-opacity)) 1px,transparent 1px);
            background-size:20px 20px;overscroll-behavior:contain
        }
        .ch-scroll::-webkit-scrollbar{width:3px}
        .ch-scroll::-webkit-scrollbar-track{background:transparent}
        .ch-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

        .ld-trigger{
            text-align:center;padding:14px;color:var(--muted);font-size:12px;
            flex-shrink:0;user-select:none
        }
        .mini-sp{
            display:inline-block;width:16px;height:16px;border:2px solid var(--border);
            border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;
            vertical-align:middle;margin-right:8px
        }
        .arc-start{
            text-align:center;padding:20px;color:var(--muted);font-size:11px;
            letter-spacing:1.5px;text-transform:uppercase;flex-shrink:0
        }
        .arc-start::before,.arc-start::after{
            content:'';display:inline-block;width:40px;height:1px;
            background:var(--border);vertical-align:middle;margin:0 12px
        }
        .pg-card{
            background:var(--card);border:1px solid var(--border);
            border-left:3px solid var(--accent);border-radius:var(--rad);
            overflow:hidden;flex-shrink:0;animation:fadeUp .35s ease both;
            transition:background .3s,border-color .3s
        }
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
        .pg-head{
            padding:6px 12px;border-bottom:1px solid var(--border);
            display:flex;align-items:center;justify-content:space-between;
            background:rgba(255,255,255,.01);transition:border-color .3s
        }
        .pg-tag{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
        .pg-head-r{display:flex;align-items:center;gap:8px}
        .pg-num{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
        .pg-bm{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;display:flex;align-items:center;border-radius:4px}
        .pg-bm:active{color:var(--fg)}
        .pg-bm.on{color:var(--accent)}
        .pg-bm.on svg{fill:currentColor}

        .pg-text {
            padding: 12px;
            font-size: var(--pg-fs, 14px);
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--fg);
        }
        mark{background:var(--accent);color:#141414;padding:0 2px;border-radius:3px}

        .sb-btn{
            position:fixed;bottom:20px;bottom:max(20px,env(safe-area-inset-bottom));
            right:16px;width:44px;height:44px;border-radius:50%;
            background:var(--card);border:1px solid var(--border);color:var(--fg);
            display:none;align-items:center;justify-content:center;cursor:pointer;
            z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.4);
            transition:transform .15s,background .3s,border-color .3s
        }
        .sb-btn:active{transform:scale(.9);background:var(--border)}
        .sb-btn.on{display:flex}
        .toast{
            position:fixed;bottom:80px;left:50%;
            transform:translateX(-50%) translateY(80px);
            background:var(--card);border:1px solid var(--border);color:var(--fg);
            padding:10px 20px;border-radius:10px;font-size:13px;z-index:200;
            transition:transform .3s ease,background .3s,border-color .3s,color .3s;
            white-space:nowrap;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);
            max-width:92vw;overflow:hidden;text-overflow:ellipsis
        }
        .toast.on{transform:translateX(-50%) translateY(0)}
        .toast.t-err{border-color:var(--err);color:var(--err)}

        /* === MENU DROPDOWN === */
        .menu-dd {
            position: absolute; top: 100%; right: 0; margin-top: 8px;
            width: min(320px, calc(100vw - 24px));
            max-height: calc(100dvh - 110px);
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--rad); box-shadow: 0 12px 32px rgba(0,0,0,.5);
            z-index: 15; display: none; flex-direction: column; overflow-y: auto;
            transition: background .3s, border-color .3s;
        }
        .menu-dd::-webkit-scrollbar { width: 4px; }
        .menu-dd::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .menu-dd.on { display: flex; }
        .dd-sec { border-bottom: 1px solid var(--border); flex-shrink: 0 }
        .dd-sec:last-child { border-bottom: none }
        .dd-hd {
            font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--muted); padding: 10px 12px 4px; font-weight: 700
        }
        .dd-hd span { text-transform: none; letter-spacing: 0; font-weight: 400 }

        .bm-list { max-height: 240px; overflow-y: auto; padding: 4px 0 }
        .bm-list::-webkit-scrollbar { width: 4px; }
        .bm-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .bm-item {
            padding: 8px 16px; font-size: 13px; color: var(--fg2); cursor: pointer;
            transition: background .15s, color .15s; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .bm-item:hover { background: var(--bg2); color: var(--fg); }
        .bm-item .bm-label { overflow: hidden; text-overflow: ellipsis; flex: 1 }
        .bm-empty { padding: 14px 16px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.6 }
        .bm-del {
            background: none; border: none; color: var(--muted); font-size: 18px;
            cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0
        }
        .bm-del:hover { color: var(--err) }
        .dd-action {
            margin: 4px 12px 8px; padding: 8px 10px; background: var(--bg);
            border: 1px dashed var(--border); border-radius: 8px; color: var(--fg2);
            font-size: 12px; cursor: pointer; width: calc(100% - 24px);
            text-align: left; font-family: inherit; transition: border-color .2s, color .2s
        }
        .dd-action:hover { border-color: var(--accent); color: var(--fg) }

        /* Search */
        .search-row { display: flex; gap: 8px; padding: 8px 12px 6px }
        .search-row input {
            flex: 1; min-width: 0; background: var(--bg); border: 1.5px solid var(--border);
            border-radius: 8px; color: var(--fg); padding: 8px 10px; font-size: 13px;
            font-family: inherit; outline: none; transition: border-color .2s
        }
        .search-row input:focus { border-color: var(--accent) }
        .search-row button {
            width: 36px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); color: var(--fg); cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center
        }
        .search-row button:active { background: var(--bg2) }
        #search-status { padding: 0 12px; font-size: 11px; color: var(--muted); min-height: 15px; line-height: 15px }
        #search-results { max-height: 220px }
        .sr-item {
            padding: 8px 12px; font-size: 12px; color: var(--fg2); cursor: pointer;
            display: flex; gap: 8px; transition: background .15s; line-height: 1.45
        }
        .sr-item:hover { background: var(--bg2); color: var(--fg) }
        .sr-pg {
            color: var(--accent); font-weight: 700; flex-shrink: 0;
            font-variant-numeric: tabular-nums; font-size: 11px; padding-top: 1px
        }
        .sr-snip { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word }

        /* Appearance controls */
        .fs-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-size: 13px; color: var(--fg2) }
        .fs-row .fs-lbl { flex: 1 }
        .fs-btn {
            width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); color: var(--fg); cursor: pointer; font-weight: 700;
            font-family: inherit; font-size: 14px; transition: border-color .2s
        }
        .fs-btn:active { border-color: var(--accent) }
        #fs-val { font-variant-numeric: tabular-nums; color: var(--fg); min-width: 34px; text-align: center; font-size: 12px }
        .font-pill{padding:4px 9px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--fg2);font-size:12px;cursor:pointer;transition:border-color .15s;font-family:inherit}
        .font-pill.sel{border-color:var(--accent);color:var(--fg)}
        .swatch{width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;padding:0;transition:box-shadow .15s}
        .swatch.sel{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--fg2)}

        /* === MINI GAMES === */
        #game-modal{
            position:fixed;inset:0;display:none;align-items:center;justify-content:center;
            background:rgba(0,0,0,.65);z-index:70;padding:16px;backdrop-filter:blur(4px)
        }
        .game-card{
            background:var(--card);border:1px solid var(--border);border-radius:16px;
            width:100%;max-width:400px;max-height:min(92dvh,680px);
            display:flex;flex-direction:column;overflow:hidden;
            box-shadow:0 24px 64px rgba(0,0,0,.5)
        }
        .game-top{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
        .game-top h3{flex:1;font-size:15px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        #g-body{padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
        #g-body::-webkit-scrollbar{width:4px}
        #g-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
        .game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
        .game-tile{
            background:var(--bg);border:1px solid var(--border);border-radius:12px;
            padding:14px 6px 10px;text-align:center;cursor:pointer;user-select:none;
            -webkit-user-select:none;transition:border-color .15s,transform .1s
        }
        .game-tile:active{transform:scale(.96);border-color:var(--accent)}
        .g-ico{font-size:26px}
        .g-name{font-size:12px;font-weight:500;margin-top:6px;color:var(--fg)}
        .g-hs{font-size:10px;color:var(--muted);margin-top:3px;min-height:12px}
        .g-bar{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--fg2);margin-bottom:10px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
        .g-msg{min-height:18px;font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.5}
        .t2048{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:7px;touch-action:none;user-select:none;-webkit-user-select:none}
        .t-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:7px;background:rgba(255,255,255,.03);font-weight:700;transition:background .1s}
        .ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:250px;margin:0 auto}
        .ttt button{aspect-ratio:1;font-size:26px;background:var(--bg);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--accent);font-family:inherit;transition:border-color .15s}
        .ttt button.o{color:var(--fg2)}
        .ttt button:hover{border-color:var(--accent)}
        .lo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:270px;margin:0 auto}
        .lo-grid button{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--bg);cursor:pointer;transition:background .15s,border-color .15s}
        .lo-grid button.on{background:var(--accent);border-color:var(--accent)}

        /* On-screen controls for mobile */
        .dp{display:grid;grid-template-columns:repeat(3,60px);grid-auto-rows:50px;gap:8px;justify-content:center;margin-top:12px;touch-action:none}
        .dp button,.dp-row button{
            border-radius:10px;border:1px solid var(--border);background:var(--bg);
            color:var(--fg);font-size:16px;cursor:pointer;touch-action:none;
            user-select:none;-webkit-user-select:none;font-family:inherit;
            transition:border-color .15s,background .15s
        }
        .dp button:active,.dp-row button:active{border-color:var(--accent);background:var(--bg2)}
        .dp-row{display:flex;gap:8px;justify-content:center;margin-top:12px;touch-action:none}
        .dp-row button{width:58px;height:44px}

        /* Username & leaderboard views */
        .name-form{display:flex;flex-direction:column;gap:12px;padding-top:8px}
        .name-form input{
            background:var(--bg);border:1.5px solid var(--border);border-radius:10px;
            color:var(--fg);padding:12px 14px;font-size:16px;font-family:inherit;
            outline:none;text-align:center;transition:border-color .2s
        }
        .name-form input:focus{border-color:var(--accent)}
        .name-err{color:var(--err);font-size:12px;min-height:16px;text-align:center}
        .list-actions{display:flex;gap:10px;margin-top:14px}
        .g-btn{
            flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);
            background:var(--bg);color:var(--fg);cursor:pointer;font-size:13px;
            font-weight:500;font-family:inherit;transition:border-color .15s
        }
        .g-btn:active{border-color:var(--accent)}
        .chip-row{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 10px}
        .lb-chip{
            padding:6px 11px;border-radius:16px;border:1px solid var(--border);
            background:var(--bg);color:var(--fg2);font-size:11px;cursor:pointer;font-family:inherit;
            transition:border-color .15s,color .15s
        }
        .lb-chip.sel{border-color:var(--accent);color:var(--fg)}
        .lb-note{font-size:11px;color:var(--muted);padding:0 2px 8px}
        .lb-live{color:var(--ok);font-weight:700}
        .lb-row{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:13px;border-bottom:1px solid var(--border);color:var(--fg2)}
        .lb-row:last-child{border-bottom:none}
        .lb-rank{width:28px;flex-shrink:0;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
        .lb-row.top .lb-rank{color:var(--accent);font-weight:700}
        .lb-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
        .lb-row.me .lb-name{color:var(--accent);font-weight:700}
        .lb-score{font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}
        .lb-date{font-size:10px;color:var(--muted);flex-shrink:0;width:46px;text-align:right}

        @media(prefers-reduced-motion:reduce){
            .pw-card,.pg-card{animation:none}
            .sp,.mini-sp{animation-duration:1.5s}
            .inp-wrap input.shake{animation:none}
        }
    </style>
</head>
<body>

    <!-- ========== PASSWORD SCREEN ========== -->
    <div id="pw-screen">
        <div class="pw-card">
            <div class="lock-wrap">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <h1>Chat Archive</h1>
            <p class="sub">This archive is password-protected. Enter the correct password to view the messages inside.</p>
            <div class="inp-wrap">
                <input type="password" id="pw-in" placeholder="Enter password" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                <button class="eye-btn" id="eye-b" type="button" aria-label="Toggle password visibility">
                    <svg id="eye-o" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg id="eye-c" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </button>
            </div>
            <div class="fld-err" id="fld-err"></div>
            <button class="go-btn" id="go-btn">Unlock Archive</button>
        </div>
    </div>

    <!-- ========== LOADING SCREEN ========== -->
    <div id="ld-screen">
        <div class="sp"></div>
        <div class="ld-txt" id="ld-txt">Decrypting archive...</div>
        <div class="ld-det" id="ld-det"></div>
    </div>

    <!-- ========== RESUME READING MODAL ========== -->
    <div id="resume-modal">
        <div class="pw-card">
            <div class="r-ico">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>
                </svg>
            </div>
            <h1>Welcome back</h1>
            <p class="sub">You stopped on page <b id="r-pg" style="color:var(--fg)"></b>.</p>
            <button class="go-btn" id="r-cont">Continue reading</button>
            <button class="go-btn ghost" id="r-latest">Jump to latest messages</button>
            <button class="link-btn" id="r-start">Start from the beginning</button>
        </div>
    </div>

    <!-- ========== CHAT VIEW ========== -->
    <div id="chat-view">
        <header class="ch-hdr">
            <div class="hdr-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
            </div>
            <div class="hdr-info">
                <h2>Chat Archive</h2>
                <input type="number" id="hdr-meta" value="0" min="1" aria-label="Jump to page">
            </div>
            <button class="theme-btn" id="game-b" aria-label="Mini games">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="10" rx="5"/>
                    <line x1="7" y1="10" x2="7" y2="14"/><line x1="5" y1="12" x2="9" y2="12"/>
                    <line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/>
                </svg>
            </button>
            <button class="theme-btn" id="menu-b" aria-label="Bookmarks and search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                </svg>
            </button>
            <button class="theme-btn" id="theme-b" aria-label="Toggle theme">
                <svg id="ico-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg id="ico-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>

            <div class="progress"><div id="prog-fill"></div></div>

            <div id="menu-dd" class="menu-dd">
                <div class="dd-sec">
                    <div class="dd-hd">Search</div>
                    <div class="search-row">
                        <input type="text" id="search-in" placeholder="Search all pages…  ( / )" autocomplete="off" spellcheck="false">
                        <button id="search-go" aria-label="Search">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            </svg>
                        </button>
                    </div>
                    <div id="search-status"></div>
                    <div id="search-results" class="bm-list"></div>
                </div>
                <div class="dd-sec">
                    <div class="dd-hd">Your bookmarks <span id="ubm-count"></span></div>
                    <button class="dd-action" id="bm-add">＋ Bookmark page <b id="bm-add-pg">—</b></button>
                    <div id="ubm-list" class="bm-list"></div>
                </div>
                <div class="dd-sec">
                    <div class="dd-hd">Document outline</div>
                    <div id="bm-list" class="bm-list"></div>
                </div>
                <div class="dd-sec">
                    <div class="dd-hd">Appearance</div>
                    <div class="fs-row">
                        <span class="fs-lbl">Text size</span>
                        <button class="fs-btn" id="fs-minus" aria-label="Decrease text size">A−</button>
                        <span id="fs-val">14px</span>
                        <button class="fs-btn" id="fs-plus" aria-label="Increase text size">A+</button>
                    </div>
                    <div class="fs-row" style="flex-wrap:wrap">
                        <span class="fs-lbl">Font</span>
                        <span id="font-row" style="display:flex;gap:6px;flex-wrap:wrap"></span>
                    </div>
                    <div class="fs-row">
                        <span class="fs-lbl">Accent</span>
                        <span id="accent-row" style="display:flex;gap:9px;align-items:center"></span>
                    </div>
                </div>
            </div>
        </header>
        <div class="ch-scroll" id="ch-scroll"></div>
        <button class="sb-btn" id="sb-btn" aria-label="Scroll to latest messages">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        </button>
    </div>

    <!-- ========== MINI GAMES MODAL ========== -->
    <div id="game-modal">
        <div class="game-card">
            <div class="game-top">
                <button class="theme-btn" id="g-back" style="display:none" aria-label="Back">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </button>
                <h3 id="g-title">Mini Games</h3>
                <button class="theme-btn" id="g-lb" style="display:none" aria-label="Leaderboard">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 21h8"/><path d="M12 17v4"/>
                        <path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/>
                        <path d="M7 6H4a3 3 0 0 0 3 5"/><path d="M17 6h3a3 3 0 0 1-3 5"/>
                    </svg>
                </button>
                <button class="theme-btn" id="g-restart" style="display:none" aria-label="Restart game">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                    </svg>
                </button>
                <button class="theme-btn" id="g-close" aria-label="Close games">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div id="g-body"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast-el"></div>

    <script>
        /* =============================================
           PDF.js worker setup
           ============================================= */
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        /* =============================================
           CONFIGURATION
           ============================================= */
        var PDF_FILE    = 'chat.pdf';
        var BATCH       = 50;

        /* =============================================
           GLOBAL LEADERBOARD — Firebase config
           ============================================= */
        var FIREBASE_CONFIG = {
            apiKey:            "AIzaSyCEhQ0MPvNq2vlDH4-wMLU_ePgezGj851c",
            authDomain:        "chat-archive-b231b.firebaseapp.com",
            databaseURL:       "https://chat-archive-b231b-default-rtdb.firebaseio.com",
            projectId:         "chat-archive-b231b",
            storageBucket:     "chat-archive-b231b.firebasestorage.app",
            messagingSenderId: "895195672571",
            appId:             "1:895195672571:web:310c32b791a3609408655e"
        };
        var LB_PATH = 'scores';

        /* =============================================
           App state
           ============================================= */
        var pdf        = null;
        var totalPgs   = 0;
        var firstPg    = 1;
        var lastPg     = 1;
        var busy       = false;
        var atStart    = false;
        var atEnd      = false;
        var curPage    = 1;
        var hlTerm     = null;
        var hlPage     = 0;

        /* =============================================
           DOM handles
           ============================================= */
        var $pw     = document.getElementById('pw-screen');
        var $ld     = document.getElementById('ld-screen');
        var $cv     = document.getElementById('chat-view');
        var $pwIn   = document.getElementById('pw-in');
        var $eyeB   = document.getElementById('eye-b');
        var $eyeO   = document.getElementById('eye-o');
        var $eyeC   = document.getElementById('eye-c');
        var $fErr   = document.getElementById('fld-err');
        var $goBtn  = document.getElementById('go-btn');
        var $ldTxt  = document.getElementById('ld-txt');
        var $ldDet  = document.getElementById('ld-det');
        var $scroll = document.getElementById('ch-scroll');
        var $meta   = document.getElementById('hdr-meta');
        var $sb     = document.getElementById('sb-btn');
        var $toast  = document.getElementById('toast-el');

        var $menuB   = document.getElementById('menu-b');
        var $menuDd  = document.getElementById('menu-dd');
        var $bmList  = document.getElementById('bm-list');
        var $ubmList = document.getElementById('ubm-list');
        var $ubmCount= document.getElementById('ubm-count');
        var $bmAdd   = document.getElementById('bm-add');
        var $bmAddPg = document.getElementById('bm-add-pg');
        var $searchIn= document.getElementById('search-in');
        var $searchGo= document.getElementById('search-go');
        var $searchSt= document.getElementById('search-status');
        var $searchRes=document.getElementById('search-results');
        var $fsMinus = document.getElementById('fs-minus');
        var $fsPlus  = document.getElementById('fs-plus');
        var $fsVal   = document.getElementById('fs-val');
        var $prog    = document.getElementById('prog-fill');
        var $rModal  = document.getElementById('resume-modal');
        var $rPg     = document.getElementById('r-pg');
        var $rCont   = document.getElementById('r-cont');
        var $rLatest = document.getElementById('r-latest');
        var $rStart  = document.getElementById('r-start');

        var $gModal  = document.getElementById('game-modal');
        var $gTitle  = document.getElementById('g-title');
        var $gBody   = document.getElementById('g-body');
        var $gBack   = document.getElementById('g-back');
        var $gLb     = document.getElementById('g-lb');
        var $gRestart= document.getElementById('g-restart');
        var $gClose  = document.getElementById('g-close');
        var $gameB   = document.getElementById('game-b');

        /* =============================================
           Theme toggle (dark / light)
           ============================================= */
        var $themeB  = document.getElementById('theme-b');
        var $icoSun  = document.getElementById('ico-sun');
        var $icoMoon = document.getElementById('ico-moon');
        var isDark   = true;

        var saved = localStorage.getItem('chat-arc-theme');
        if (saved === 'light') {
            isDark = false;
            document.documentElement.classList.add('light');
            $icoSun.style.display  = 'none';
            $icoMoon.style.display = 'block';
        }

        $themeB.addEventListener('click', function() {
            isDark = !isDark;
            if (isDark) {
                document.documentElement.classList.remove('light');
                $icoSun.style.display  = 'block';
                $icoMoon.style.display = 'none';
                localStorage.setItem('chat-arc-theme', 'dark');
            } else {
                document.documentElement.classList.add('light');
                $icoSun.style.display  = 'none';
                $icoMoon.style.display = 'block';
                localStorage.setItem('chat-arc-theme', 'light');
            }
        });

        /* =============================================
           Appearance: text size, font, accent color
           ============================================= */
        function setFs(v) {
            v = Math.max(11, Math.min(24, v));
            document.documentElement.style.setProperty('--pg-fs', v + 'px');
            localStorage.setItem('chat-arc-fs', v);
            $fsVal.textContent = v + 'px';
        }
        setFs(parseInt(localStorage.getItem('chat-arc-fs'), 10) || 14);
        $fsMinus.addEventListener('click', function() { setFs((parseInt(localStorage.getItem('chat-arc-fs'), 10) || 14) - 1); });
        $fsPlus .addEventListener('click', function() { setFs((parseInt(localStorage.getItem('chat-arc-fs'), 10) || 14) + 1); });

        var FONTS = [
            { id:'dm',    label:'DM Sans', stack:"'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif" },
            { id:'inter', label:'Inter',   stack:"'Inter',-apple-system,BlinkMacSystemFont,sans-serif" },
            { id:'lora',  label:'Lora',    stack:"'Lora',Georgia,'Times New Roman',serif" },
            { id:'mono',  label:'JetBrains', stack:"'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" }
        ];
        var ACCENTS = [
            { id:'gold',    c:'#d4a03c' },
            { id:'emerald', c:'#3ecf8e' },
            { id:'azure',   c:'#4db8ff' },
            { id:'rose',    c:'#ef6f8f' },
            { id:'violet',  c:'#a98bff' }
        ];
        var $fontRow   = document.getElementById('font-row');
        var $accentRow = document.getElementById('accent-row');

        FONTS.forEach(function(f) {
            var b = document.createElement('button');
            b.className = 'font-pill';
            b.textContent = f.label;
            b.style.fontFamily = f.stack;
            b.setAttribute('data-f', f.id);
            b.addEventListener('click', function() { applyFont(f.id); });
            $fontRow.appendChild(b);
        });
        ACCENTS.forEach(function(a) {
            var b = document.createElement('button');
            b.className = 'swatch';
            b.style.background = a.c;
            b.setAttribute('aria-label', a.id + ' accent');
            b.setAttribute('data-a', a.id);
            b.title = a.id.charAt(0).toUpperCase() + a.id.slice(1);
            b.addEventListener('click', function() { applyAccent(a.id); });
            $accentRow.appendChild(b);
        });

        function applyFont(id) {
            var f = FONTS[0];
            for (var i = 0; i < FONTS.length; i++) if (FONTS[i].id === id) f = FONTS[i];
            document.documentElement.style.setProperty('--font', f.stack);
            try { localStorage.setItem('chat-arc-font', f.id); } catch (e) {}
            var ps = $fontRow.children;
            for (var i = 0; i < ps.length; i++) ps[i].classList.toggle('sel', ps[i].getAttribute('data-f') === f.id);
        }
        function applyAccent(id) {
            if (id === 'gold') document.documentElement.removeAttribute('data-accent');
            else document.documentElement.setAttribute('data-accent', id);
            try { localStorage.setItem('chat-arc-accent', id); } catch (e) {}
            var ss = $accentRow.children;
            for (var i = 0; i < ss.length; i++) ss[i].classList.toggle('sel', ss[i].getAttribute('data-a') === id);
        }
        applyFont(localStorage.getItem('chat-arc-font') || 'dm');
        applyAccent(localStorage.getItem('chat-arc-accent') || 'gold');

        /* =============================================
           Password screen interactions
           ============================================= */
        $eyeB.addEventListener('click', function() {
            var show = $pwIn.type === 'password';
            $pwIn.type = show ? 'text' : 'password';
            $eyeO.style.display = show ? 'none' : 'block';
            $eyeC.style.display = show ? 'block' : 'none';
        });

        $pwIn.addEventListener('input', function() {
            $fErr.textContent = '';
            $pwIn.classList.remove('shake');
        });

        $pwIn.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') $goBtn.click();
        });

        $goBtn.addEventListener('click', function() {
            var v = $pwIn.value;
            if (!v) {
                $fErr.textContent = 'Please enter a password.';
                $pwIn.classList.add('shake');
                return;
            }
            $fErr.textContent = '';
            $pwIn.classList.remove('shake');
            $goBtn.disabled = true;
            $goBtn.textContent = 'Verifying...';
            tryLoad(v, false);
        });

        /* =============================================
           Reading position — save & restore
           ============================================= */
        var saveT = null;
        function savePosNow() {
            if (!pdf || $cv.style.display === 'none') return;
            var rel = 0;
            var card = $scroll.querySelector('.pg-card[data-pg="' + curPage + '"]');
            if (card) {
                var r = card.getBoundingClientRect();
                rel = Math.max(0, Math.min(1, ((window.innerHeight * 0.35) - r.top) / Math.max(1, r.height)));
            }
            try {
                localStorage.setItem('chat-arc-pos',
                    JSON.stringify({ pg: curPage, rel: rel, t: Date.now() }));
            } catch (e) {}
        }
        function savePos() {
            clearTimeout(saveT);
            saveT = setTimeout(savePosNow, 400);
        }
        function readPos() {
            try {
                var p = JSON.parse(localStorage.getItem('chat-arc-pos') || 'null');
                if (p && p.pg >= 1 && p.pg <= totalPgs) return p;
            } catch (e) {}
            return null;
        }
        window.addEventListener('beforeunload', savePosNow);
        document.addEventListener('visibilitychange', function() { if (document.hidden) savePosNow(); });

        function setProgress(pg) {
            if (!totalPgs) return;
            $prog.style.width = ((pg / totalPgs) * 100) + '%';
        }

        /* =============================================
           User bookmarks
           ============================================= */
        function getBms() {
            try { return JSON.parse(localStorage.getItem('chat-arc-bms') || '[]'); }
            catch (e) { return []; }
        }
        function setBms(a) {
            try { localStorage.setItem('chat-arc-bms', JSON.stringify(a)); } catch (e) {}
        }
        function toggleBm(pg) {
            var a = getBms();
            var i = a.findIndex(function(b) { return b.pg === pg; });
            if (i >= 0) {
                a.splice(i, 1);
                toast('Bookmark removed — page ' + pg);
            } else {
                a.push({ pg: pg, t: Date.now() });
                a.sort(function(x, y) { return x.pg - y.pg; });
                toast('Bookmarked page ' + pg);
            }
            setBms(a);
            refreshBmUI();
        }
        function refreshBmUI() {
            var s = {};
            getBms().forEach(function(b) { s[b.pg] = 1; });
            var btns = document.querySelectorAll('.pg-bm');
            for (var i = 0; i < btns.length; i++) {
                var on = !!s[parseInt(btns[i].getAttribute('data-pg'), 10)];
                btns[i].classList.toggle('on', on);
            }
            renderUserBms();
        }
        function renderUserBms() {
            var a = getBms();
            $ubmList.innerHTML = '';
            $ubmCount.textContent = a.length ? '(' + a.length + ')' : '';
            if (!a.length) {
                var empty = document.createElement('div');
                empty.className = 'bm-empty';
                empty.textContent = 'No bookmarks yet — tap the bookmark icon on any page.';
                $ubmList.appendChild(empty);
                return;
            }
            a.forEach(function(b) {
                var item = document.createElement('div');
                item.className = 'bm-item';

                var label = document.createElement('span');
                label.className = 'bm-label';
                label.textContent = 'Page ' + b.pg;
                item.appendChild(label);

                var del = document.createElement('button');
                del.className = 'bm-del';
                del.setAttribute('aria-label', 'Remove bookmark for page ' + b.pg);
                del.innerHTML = '&times;';
                del.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleBm(b.pg);
                });
                item.appendChild(del);

                item.addEventListener('click', function() {
                    closeMenu();
                    goToPage(b.pg);
                });
                $ubmList.appendChild(item);
            });
        }
        $bmAdd.addEventListener('click', function() { toggleBm(curPage); });

        $scroll.addEventListener('click', function(e) {
            var b = e.target.closest('.pg-bm');
            if (b) toggleBm(parseInt(b.getAttribute('data-pg'), 10));
        });

        /* =============================================
           Menu open / close
           ============================================= */
        $menuB.addEventListener('click', function(e) {
            e.stopPropagation();
            if ($menuDd.classList.contains('on')) {
                closeMenu();
            } else {
                $bmAddPg.textContent = curPage;
                renderUserBms();
                $menuDd.classList.add('on');
            }
        });

        function closeMenu() {
            $menuDd.classList.remove('on');
            searchCancel = true;
        }

        document.addEventListener('click', function(e) {
            if (!$menuDd.contains(e.target) && !$menuB.contains(e.target)) {
                closeMenu();
            }
        });

        /* =============================================
           PDF outline (built-in bookmarks)
           ============================================= */
        function buildBookmarksMenu(outline, level) {
            level = level || 0;
            var frag = document.createDocumentFragment();

            outline.forEach(function(item) {
                var el = document.createElement('div');
                el.className = 'bm-item';
                el.style.paddingLeft = (16 + level * 12) + 'px';
                var lbl = document.createElement('span');
                lbl.className = 'bm-label';
                lbl.textContent = item.title || 'Untitled';
                el.appendChild(lbl);

                el.addEventListener('click', function() {
                    if (item.dest) {
                        navigateToDest(item.dest);
                    } else if (item.url) {
                        window.open(item.url, '_blank');
                    }
                    closeMenu();
                });

                frag.appendChild(el);

                if (item.items && item.items.length > 0) {
                    frag.appendChild(buildBookmarksMenu(item.items, level + 1));
                }
            });

            return frag;
        }

        function navigateToDest(dest) {
            var promise;
            if (typeof dest === 'string') {
                promise = pdf.getDestination(dest);
            } else {
                promise = Promise.resolve(dest);
            }

            promise.then(function(explicitDest) {
                if (!explicitDest || !explicitDest[0]) return;
                pdf.getPageIndex(explicitDest[0]).then(function(pageIndex) {
                    closeMenu();
                    goToPage(pageIndex + 1);
                });
            }).catch(function(e) {
                console.error("Failed to navigate to destination", e);
                toast("Failed to jump to bookmark", true);
            });
        }

        /* =============================================
           Search across all pages
           ============================================= */
        var searching = false, searchCancel = false;

        function escHtml(s) {
            return s.replace(/[&<>"']/g, function(c) {
                return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
            });
        }
        function highlightHTML(text, term) {
            var esc = escHtml(text);
            var t = escHtml(term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            try {
                return esc.replace(new RegExp(t, 'gi'), function(m) { return '<mark>' + m + '</mark>'; });
            } catch (e) { return esc; }
        }
        function makeSnippet(text, idx, q) {
            var s = Math.max(0, idx - 40), e = Math.min(text.length, idx + q.length + 70);
            return (s > 0 ? '…' : '') + highlightHTML(text.slice(s, e), q) + (e < text.length ? '…' : '');
        }

        function renderSearchResults(results, q) {
            $searchRes.innerHTML = '';
            results.forEach(function(r) {
                var item = document.createElement('div');
                item.className = 'sr-item';
                item.innerHTML =
                    '<span class="sr-pg">P' + r.pg + '</span>' +
                    '<span class="sr-snip">' + r.snip + '</span>';
                item.addEventListener('click', function() {
                    hlTerm = q; hlPage = r.pg;
                    closeMenu();
                    goToPage(r.pg);
                });
                $searchRes.appendChild(item);
            });
        }

        function runSearch() {
            var q = $searchIn.value.trim();
            if (!q || searching || !pdf) return;
            searchCancel = false; searching = true;
            var ql = q.toLowerCase(), results = [], n = 1;
            $searchRes.innerHTML = '';
            $searchSt.textContent = 'Searching… 0 / ' + totalPgs;

            function step() {
                if (searchCancel) { searching = false; return; }
                pdf.getPage(n).then(function(p) { return p.getTextContent(); }).then(function(tc) {
                    if (searchCancel) { searching = false; return; }
                    var text = reconstructText(tc);
                    var idx = text.toLowerCase().indexOf(ql);
                    if (idx >= 0 && results.length < 100) {
                        results.push({ pg: n, snip: makeSnippet(text, idx, q) });
                        renderSearchResults(results, q);
                    }
                    $searchSt.textContent = 'Searching… ' + n + ' / ' + totalPgs;
                    n++;
                    if (n <= totalPgs && results.length < 100) {
                        setTimeout(step, 0);
                    } else {
                        searching = false;
                        if (!results.length) $searchSt.textContent = 'No matches found.';
                        else $searchSt.textContent = results.length + ' page' + (results.length > 1 ? 's' : '') + ' matched' + (results.length >= 100 ? ' — showing first 100' : '');
                    }
                }).catch(function() {
                    n++;
                    if (n <= totalPgs && results.length < 100) setTimeout(step, 0);
                    else { searching = false; $searchSt.textContent = 'Search finished.'; }
                });
            }
            step();
        }
        $searchGo.addEventListener('click', runSearch);
        $searchIn.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') runSearch();
            e.stopPropagation();
        });

        /* =============================================
           Keyboard shortcuts (reader)
           ============================================= */
        document.addEventListener('keydown', function(e) {
            if ($gModal.style.display === 'flex') return;

            if ($rModal.style.display === 'flex') {
                if (e.key === 'Escape') $rCont.click();
                return;
            }
            if ($cv.style.display === 'none' || !pdf) return;
            if (e.target.tagName === 'INPUT') return;

            var amt = 0;
            if (e.key === 'ArrowDown')       amt = 90;
            else if (e.key === 'ArrowUp')    amt = -90;
            else if (e.key === 'PageDown')   amt = $scroll.clientHeight * 0.85;
            else if (e.key === 'PageUp')     amt = -$scroll.clientHeight * 0.85;
            else if (e.key === ' ')          amt = e.shiftKey ? -$scroll.clientHeight * 0.85 : $scroll.clientHeight * 0.85;
            else if (e.key === 'b' || e.key === 'B') { e.preventDefault(); toggleBm(curPage); return; }
            else if (e.key === '/') {
                e.preventDefault();
                $bmAddPg.textContent = curPage; renderUserBms();
                $menuDd.classList.add('on');
                $searchIn.focus();
                return;
            }
            else if (e.key === 'Escape') { closeMenu(); return; }
            else return;

            e.preventDefault();
            $scroll.scrollBy({ top: amt });
        });

        /* =============================================
           Page Jump Logic
           ============================================= */
        $meta.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                var pg = parseInt($meta.value, 10);
                if (!isNaN(pg)) {
                    goToPage(pg);
                    $meta.blur();
                }
            }
        });

        function goToPage(targetPg, opts) {
            opts = opts || {};
            targetPg = Math.max(1, Math.min(totalPgs, targetPg));
            if (isNaN(targetPg)) return;

            $ld.style.display = 'flex';
            $cv.style.display = 'none';
            $ldTxt.textContent = 'Jumping to page ' + targetPg + '...';
            $ldDet.textContent = '';

            $scroll.innerHTML = '';
            busy = false;

            var start = targetPg;
            var end = Math.min(totalPgs, targetPg + BATCH - 1);

            firstPg = start;
            lastPg = end;
            atStart = (firstPg <= 1);
            atEnd = (lastPg >= totalPgs);

            renderBatch(start, end, true).then(function() {
                $ld.style.display = 'none';
                $cv.style.display = 'flex';

                curPage = targetPg;
                $meta.value = targetPg;
                setProgress(targetPg);

                var targetCard = $scroll.querySelector('[data-pg="' + targetPg + '"]');
                if (targetCard) {
                    targetCard.scrollIntoView();
                    if (opts.rel) {
                        var r = targetCard.getBoundingClientRect();
                        var targetTop = $scroll.getBoundingClientRect().top + 8;
                        $scroll.scrollTop += (r.top - targetTop) + (opts.rel * targetCard.offsetHeight);
                    }
                } else {
                    $scroll.scrollTop = 0;
                }
                savePosNow();
            });
        }

        /* =============================================
           Toast helper
           ============================================= */
        var _tt = null;
        function toast(msg, err) {
            clearTimeout(_tt);
            $toast.textContent = msg;
            $toast.className = 'toast' + (err ? ' t-err' : '');
            void $toast.offsetHeight;
            $toast.classList.add('on');
            _tt = setTimeout(function() { $toast.classList.remove('on'); }, 3500);
        }

        /* =============================================
           Load & decrypt the PDF
           ============================================= */
        function tryLoad(pw, auto) {
            $pw.style.display = 'none';
            $ld.style.display = 'flex';
            $ldTxt.textContent = 'Decrypting archive...';
            $ldDet.textContent = '';

            pdfjsLib.getDocument({ url: PDF_FILE, password: pw })
            .promise.then(function(doc) {
                pdf = doc;
                totalPgs = doc.numPages;
                $meta.max = totalPgs;

                try { sessionStorage.setItem('chat-arc-pw', pw); } catch (e) {}

                doc.getOutline().then(function(outline) {
                    $bmList.innerHTML = '';
                    if (outline && outline.length > 0) {
                        $bmList.appendChild(buildBookmarksMenu(outline));
                    } else {
                        var empty = document.createElement('div');
                        empty.className = 'bm-empty';
                        empty.textContent = 'No built-in outline in this PDF';
                        $bmList.appendChild(empty);
                    }
                });

                var savedPos = readPos();
                if (auto && savedPos) {
                    goToPage(savedPos.pg, { rel: savedPos.rel || 0 });
                    toast('Resumed at page ' + savedPos.pg);
                } else if (savedPos) {
                    $rPg.textContent = savedPos.pg;
                    $ld.style.display = 'flex';
                    $rModal.style.display = 'flex';
                } else {
                    loadEndInitial();
                }
            })
            .catch(function(e) {
                console.error(e);
                $ld.style.display = 'none';
                $pw.style.display = 'flex';
                $goBtn.disabled = false;
                $goBtn.textContent = 'Unlock Archive';
                try { sessionStorage.removeItem('chat-arc-pw'); } catch (err) {}

                if (e.name === 'PasswordException') {
                    $fErr.textContent = 'Wrong password. Please try again.';
                    $pwIn.classList.add('shake');
                    $pwIn.value = '';
                    $pwIn.focus();
                } else {
                    $fErr.textContent = 'File not found. Make sure "' + PDF_FILE + '" is uploaded.';
                    $pwIn.classList.add('shake');
                }
            });
        }

        function loadEndInitial() {
            var start = Math.max(1, totalPgs - BATCH + 1);
            var end   = totalPgs;
            firstPg   = start;
            lastPg    = end;
            atStart   = (firstPg <= 1);
            atEnd     = true;

            $ldTxt.textContent = 'Extracting text...';
            $ldDet.textContent = '0 / ' + (end - start + 1);

            renderBatch(start, end, true).then(function() {
                $ld.style.display = 'none';
                $cv.style.display = 'flex';
                $meta.value = totalPgs;
                curPage = totalPgs;
                setProgress(totalPgs);
                $scroll.scrollTop = $scroll.scrollHeight;
                savePosNow();
            });
        }

        $rCont.addEventListener('click', function() {
            var p = readPos();
            $rModal.style.display = 'none';
            if (p) goToPage(p.pg, { rel: p.rel || 0 });
            else loadEndInitial();
        });
        $rLatest.addEventListener('click', function() {
            $rModal.style.display = 'none';
            loadEndInitial();
        });
        $rStart.addEventListener('click', function() {
            $rModal.style.display = 'none';
            goToPage(1);
        });

        (function() {
            var spw = null;
            try { spw = sessionStorage.getItem('chat-arc-pw'); } catch (e) {}
            if (spw) {
                $pw.style.display = 'none';
                tryLoad(spw, true);
            }
        })();

        /* =============================================
           Text extraction
           ============================================= */
        function reconstructText(textContent) {
            var pageText = '';
            var lastY = null;
            textContent.items.forEach(function(item) {
                if (lastY !== null && Math.abs(item.transform[5] - lastY) > 2) {
                    pageText += '\n';
                }
                pageText += item.str;
                if (item.hasEOL) pageText += '\n';
                lastY = item.transform[5];
            });
            return pageText.trim();
        }

        /* =============================================
           Render a batch of PDF pages
           ============================================= */
        function renderBatch(from, to, initial, position) {
            var count = to - from + 1;
            var done  = 0;
            var frag  = document.createDocumentFragment();
            var jobs  = [];
            var cards = {};

            for (var p = from; p <= to; p++) {
                (function(num) {
                    jobs.push(
                        pdf.getPage(num).then(function(page) {
                            return page.getTextContent().then(function(textContent) {
                                var card = document.createElement('div');
                                card.className = 'pg-card';
                                card.setAttribute('data-pg', num);

                                var head = document.createElement('div');
                                head.className = 'pg-head';
                                head.innerHTML =
                                    '<span class="pg-tag">Page ' + num + '</span>' +
                                    '<span class="pg-head-r">' +
                                        '<button class="pg-bm" data-pg="' + num + '" aria-label="Toggle bookmark for page ' + num + '">' +
                                            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                                                '<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>' +
                                            '</svg>' +
                                        '</button>' +
                                        '<span class="pg-num">' + num + ' / ' + totalPgs + '</span>' +
                                    '</span>';

                                card.appendChild(head);

                                var textDiv = document.createElement('div');
                                textDiv.className = 'pg-text';

                                var pageText = reconstructText(textContent) || '[No text content found on this page]';

                                if (hlTerm && num === hlPage) {
                                    textDiv.innerHTML = highlightHTML(pageText, hlTerm);
                                } else {
                                    textDiv.textContent = pageText;
                                }

                                card.appendChild(textDiv);
                                cards[num] = card;

                                done++;
                                if (initial) $ldDet.textContent = done + ' / ' + count;
                            });
                        })
                    );
                })(p);
            }

            return Promise.all(jobs).then(function() {
                for (var p = from; p <= to; p++) {
                    if (cards[p]) frag.appendChild(cards[p]);
                }

                if (initial) {
                    $scroll.appendChild(frag);

                    if (firstPg > 1) {
                        var topTrig = document.createElement('div');
                        topTrig.className = 'ld-trigger';
                        topTrig.id = 'ld-trig-top';
                        topTrig.textContent = 'Scroll up to load earlier pages';
                        $scroll.insertBefore(topTrig, $scroll.firstChild);
                    } else {
                        atStart = true;
                        var topMsg = document.createElement('div');
                        topMsg.className = 'arc-start';
                        topMsg.id = 'ld-trig-top';
                        topMsg.textContent = 'Start of Archive';
                        $scroll.insertBefore(topMsg, $scroll.firstChild);
                    }

                    if (lastPg < totalPgs) {
                        var botTrig = document.createElement('div');
                        botTrig.className = 'ld-trigger';
                        botTrig.id = 'ld-trig-bot';
                        botTrig.textContent = 'Scroll down to load later pages';
                        $scroll.appendChild(botTrig);
                    } else {
                        atEnd = true;
                        var botMsg = document.createElement('div');
                        botMsg.className = 'arc-start';
                        botMsg.id = 'ld-trig-bot';
                        botMsg.textContent = 'End of Archive';
                        $scroll.appendChild(botMsg);
                    }
                } else {
                    if (position === 'top') {
                        var trigTop = document.getElementById('ld-trig-top');
                        if (trigTop) $scroll.insertBefore(frag, trigTop);
                        else $scroll.insertBefore(frag, $scroll.firstChild);
                    } else if (position === 'bottom') {
                        var trigBot = document.getElementById('ld-trig-bot');
                        if (trigBot) $scroll.insertBefore(frag, trigBot);
                        else $scroll.appendChild(frag);
                    }
                }

                refreshBmUI();
            });
        }

        /* =============================================
           Scroll — infinite load & progress
           ============================================= */
        $scroll.addEventListener('scroll', function() {
            var fromBot = $scroll.scrollHeight - $scroll.scrollTop - $scroll.clientHeight;

            if (fromBot > 600) { $sb.classList.add('on'); }
            else               { $sb.classList.remove('on'); }

            if (!atStart && !busy && $scroll.scrollTop < 100) {
                loadOlder();
            }

            if (!atEnd && !busy && fromBot < 100) {
                loadNewer();
            }

            if (document.activeElement !== $meta) {
                var els = $scroll.querySelectorAll('.pg-card');
                for (var i = 0; i < els.length; i++) {
                    var rect = els[i].getBoundingClientRect();
                    if (rect.bottom > 80 && rect.top < window.innerHeight - 80) {
                        var pg = parseInt(els[i].getAttribute('data-pg'), 10);
                        if ($meta.value != pg) $meta.value = pg;
                        if (curPage !== pg) {
                            curPage = pg;
                            setProgress(pg);
                            savePos();
                        }
                        break;
                    }
                }
            }
        });

        function loadOlder() {
            busy = true;
            var trig = document.getElementById('ld-trig-top');
            if (trig) trig.innerHTML = '<span class="mini-sp"></span>Loading earlier pages...';

            var prevScrollTop = $scroll.scrollTop;
            var prevH = $scroll.scrollHeight;

            var newFirst = Math.max(1, firstPg - BATCH);
            var newLast  = firstPg - 1;

            renderBatch(newFirst, newLast, false, 'top').then(function() {
                firstPg = newFirst;

                var newH = $scroll.scrollHeight;
                $scroll.scrollTop = prevScrollTop + (newH - prevH);

                busy = false;

                var trig = document.getElementById('ld-trig-top');
                if (firstPg <= 1) {
                    atStart = true;
                    if (trig) {
                        trig.className = 'arc-start';
                        trig.innerHTML = 'Start of Archive';
                    }
                } else {
                    if (trig) trig.innerHTML = 'Scroll up to load earlier pages';
                }
            });
        }

        function loadNewer() {
            busy = true;
            var trig = document.getElementById('ld-trig-bot');
            if (trig) trig.innerHTML = '<span class="mini-sp"></span>Loading later pages...';

            var prevScrollTop = $scroll.scrollTop;

            var newFirst = lastPg + 1;
            var newLast  = Math.min(totalPgs, lastPg + BATCH);

            renderBatch(newFirst, newLast, false, 'bottom').then(function() {
                lastPg = newLast;
                $scroll.scrollTop = prevScrollTop;
                busy = false;

                var trig = document.getElementById('ld-trig-bot');
                if (lastPg >= totalPgs) {
                    atEnd = true;
                    if (trig) {
                        trig.className = 'arc-start';
                        trig.innerHTML = 'End of Archive';
                    }
                } else {
                    if (trig) trig.innerHTML = 'Scroll down to load later pages';
                }
            });
        }

        $sb.addEventListener('click', function() {
            $scroll.scrollTo({ top: $scroll.scrollHeight, behavior: 'smooth' });
        });

        /* =====================================================
           =====================================================
             MINI GAMES + GLOBAL LEADERBOARD
           -----------------------------------------------------
           NOTE ON SPEED: canvas games (Flappy, Breakout) use a
           FIXED-TIMESTEP loop — physics always run at 60 steps
           per second no matter the screen refresh rate, so the
           game speed is identical on 60Hz and 120Hz devices.
           Each game has a TUNING block at the top of its init()
           if you want to make anything faster or slower.
           =====================================================
           ===================================================== */
        var GAMES = {};
        function registerGame(id, def) { GAMES[id] = def; }

        var LB_ORDER = ['snake', '2048', 'flappy', 'breakout', 'lights'];

        /* --- Firebase init (graceful fallback) --- */
        var fbDb = null;
        (function() {
            try {
                if (FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey &&
                    FIREBASE_CONFIG.apiKey.indexOf('PASTE') === -1 &&
                    FIREBASE_CONFIG.databaseURL &&
                    FIREBASE_CONFIG.databaseURL.indexOf('PASTE') === -1) {
                    firebase.initializeApp(FIREBASE_CONFIG);
                    fbDb = firebase.database();
                }
            } catch (e) {
                console.warn('Firebase unavailable — leaderboard is device-local.', e);
                fbDb = null;
            }
        })();
        function fbOn() { return !!fbDb; }

        /* --- Username storage --- */
        function getUsername() {
            try { return localStorage.getItem('chat-arc-username') || ''; }
            catch (e) { return ''; }
        }
        function setUsername(v) {
            try { localStorage.setItem('chat-arc-username', v); } catch (e) {}
        }

        /* --- Device-local fallback store --- */
        function localLb() {
            try { return JSON.parse(localStorage.getItem('chat-arc-lb') || '{}'); }
            catch (e) { return {}; }
        }
        function localSaveLb(lb) {
            try { localStorage.setItem('chat-arc-lb', JSON.stringify(lb)); } catch (e) {}
        }

        /* --- Submit a score --- */
        var _lastSub = 0;
        function submitScore(id, score) {
            var g = GAMES[id];
            if (!g || !score || score <= 0) return;

            var name = getUsername() || 'Guest';
            var t = Date.now();

            try {
                var lb = localLb();
                var arr = lb[id] || [];
                arr.push({ n: name, s: score, t: t });
                arr.sort(g.lbLower ? function(a, b) { return a.s - b.s; }
                                   : function(a, b) { return b.s - a.s; });
                lb[id] = arr.slice(0, 100);
                localSaveLb(lb);
            } catch (e) {}

            if (fbOn()) {
                if (t - _lastSub < 1500) return;
                _lastSub = t;
                fbDb.ref(LB_PATH + '/' + id).push({ n: name, s: score, t: t }, function(err) {
                    if (err) {
                        console.warn('Global submit failed', err);
                        toast('Saved on this device (global sync failed)', true);
                        return;
                    }
                    setTimeout(function() { fetchRank(id, score, name); }, 1200);
                });
            } else {
                toast('Saved locally — add Firebase config to go global');
            }
        }

        /* --- One-shot global rank check --- */
        function fetchRank(id, score, name) {
            if (!fbOn() || !GAMES[id]) return;
            var base = fbDb.ref(LB_PATH + '/' + id).orderByChild('s');
            var q = GAMES[id].lbLower ? base.endAt(score - 1) : base.startAt(score + 1);
            q.once('value').then(function(snap) {

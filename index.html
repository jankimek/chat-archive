                toast('🏆 ' + name + ' is #' + (snap.numChildren() + 1) + ' globally in ' + GAMES[id].name);
            }).catch(function() {});
        }

        /* --- Live subscription for the leaderboard view --- */
        var _lbUnsub = null;

            var STEP_MS = 1000 / 60;
            var acc = 0, last = 0, raf = 0;
            function reset() { last = 0; acc = 0; }
            function frame(now) {
                if (!last) last = now;
                var delta = now - last;
                last = now;
                if (delta > 100) delta = STEP_MS; // ignore tab-switch gaps
                acc += delta;
                var n = 0;
                while (acc >= STEP_MS && n < 4) { physics(); acc -= STEP_MS; n++; }

                };

                    for (i = 0; i < 4; i++) if (line[i]) a.push(line[i]);

                    for (var i = 0; i < LINES.length; i++) {
                        var L = LINES[i];
                        if (bd[L[0]] && bd[L[0]] === bd[L[1]] && bd[L[0]] === bd[L[2]]) return bd[L[0]];
                    }
                    for (var j = 0; j < 9; j++) if (!bd[j]) return 0;

                    for (var i = 0; i < LINES.length; i++) {
                        var L = LINES[i], c = 0, e = -1;
                        for (var j = 0; j < 3; j++) {
                            var v = bd[L[j]];
                            if (v === p) c++;
                            else if (!v) e = L[j];
                        }
                        if (c === 2 && e >= 0) return e;
                    }
                    return -1;
                }
                function aiMove() {
                    var m = findSpot(bd, 2);
                    if (m < 0) m = findSpot(bd, 1);
                    if (m < 0 && !bd[4]) m = 4;
                    if (m < 0) {
                        var cs = [0,2,6,8].filter(function(i){ return !bd[i]; });
                        if (cs.length) m = cs[(Math.random()*cs.length)|0];

                   Frame-rate independent: same speed on every device. */
                var GRAV     = 0.36;   // downward pull per tick
                var JUMP     = -6.7;   // flap impulse
                var PIPE_SPD = 1.8;    // pipe scroll speed
                var GAP      = 118;    // gap between pipes (px)
                var SPACING  = 190;    // px between pipes

                var W = 300, H = 420, PW = 48, BX = 70, BR = 10;
                var cv = makeCanvas(root, W, H), ctx = cv.ctx;
                var bar = gameBar(root);
                var msg = gameMsg(root);
                msg.textContent = 'Tap anywhere or press Space to flap';
                var accent = cssVar('--accent');
                var bird, pipes, score, dead, started, raf = 0;
                var hs = parseInt(localStorage.getItem(this.hsKey), 10) || 0;

                function upd() { bar.innerHTML = '<span>Score ' + score + '</span><span>Best ' + hs + '</span>'; }
                function reset() {
                    bird = { y: H/2, vy: 0 }; pipes = [];
                    score = 0; dead = false; started = false;
                    upd(); draw();
                }
                function die() {
                    dead = true;
                    if (score > hs) { hs = score; localStorage.setItem(GAMES.flappy.hsKey, hs); }
                    submitScore('flappy', score);
                    upd(); draw();
                }
                /* Physics: one fixed 1/60s tick (called by the loop) */
                function physics() {
                    if (dead) return;
                    bird.vy += GRAV;
                    bird.y  += bird.vy;
                    if (bird.y < BR) { bird.y = BR; bird.vy = 0; }
                    if (!pipes.length || pipes[pipes.length-1].x < W - SPACING)
                        pipes.push({ x: W + 8, gy: 60 + Math.random()*(H - GAP - 150), passed: false });
                    for (var i = pipes.length - 1; i >= 0; i--) {
                        var p = pipes[i];
                        p.x -= PIPE_SPD;
                        if (!p.passed && p.x + PW < BX - BR) { p.passed = true; score++; upd(); }
                        if (p.x + PW < -8) pipes.splice(i, 1);
                        if (BX + BR > p.x && BX - BR < p.x + PW &&
                            (bird.y - BR < p.gy || bird.y + BR > p.gy + GAP)) { die(); return; }
                    }
                    if (bird.y + BR >= H - 26) { bird.y = H - 26 - BR; die(); }
                }
                function draw() {
                    ctx.fillStyle = '#0d0d0d'; ctx.fillRect(0, 0, W, H);
                    for (var i = 0; i < pipes.length; i++) {
                        var p = pipes[i];
                        ctx.globalAlpha = 0.18; ctx.fillStyle = accent;
                        ctx.fillRect(p.x, 0, PW, p.gy);
                        ctx.fillRect(p.x, p.gy + GAP, PW, H - 26 - p.gy - GAP);
                        ctx.globalAlpha = 1; ctx.strokeStyle = accent; ctx.lineWidth = 1.5;
                        ctx.strokeRect(p.x, 0, PW, p.gy);
                        ctx.strokeRect(p.x, p.gy + GAP, PW, H - 26 - p.gy - GAP);
                    }
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(0, H - 26, W, 26);
                    ctx.strokeStyle = accent; ctx.globalAlpha = .5;
                    ctx.beginPath(); ctx.moveTo(0, H - 26); ctx.lineTo(W, H - 26); ctx.stroke();
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = accent;
                    ctx.beginPath(); ctx.arc(BX, bird.y, BR, 0, 7); ctx.fill();
                    ctx.fillStyle = '#0a0a0a';
                    ctx.beginPath(); ctx.arc(BX + 4, bird.y - 3, 2, 0, 7); ctx.fill();
                    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
                    if (!started) {
                        ctx.font = '700 20px "DM Sans",sans-serif';
                        ctx.fillText('Tap or press Space', W/2, H/2 - 60);
                        ctx.fillStyle = '#888'; ctx.font = '12px "DM Sans",sans-serif';
                        ctx.fillText('to start flapping', W/2, H/2 - 38);
                    } else if (!dead) {
                        ctx.font = '700 30px "DM Sans",sans-serif';
                        ctx.fillText(score, W/2, 50);
                    }
                    if (dead) {
                        ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
                        ctx.fillStyle = '#fff'; ctx.font = '700 22px "DM Sans",sans-serif';
                        ctx.fillText('Game Over', W/2, H/2 - 30);
                        ctx.font = '14px "DM Sans",sans-serif';
                        ctx.fillText('Score ' + score + '  ·  Best ' + hs, W/2, H/2 - 4);
                        ctx.fillStyle = '#888'; ctx.font = '12px "DM Sans",sans-serif';
                        ctx.fillText('Tap or Space to retry', W/2, H/2 + 26);
                    }
                }
                var loop = fixedLoop(physics, draw, function() { return !dead; });
                function flap() {
                    if (dead) { reset(); return; }
                    if (!started) { started = true; loop.start(); }
                    bird.vy = JUMP;
                }
                function onKey(e) {
                    if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); flap(); }
                }
                cv.c.addEventListener('pointerdown', flap);
                document.addEventListener('keydown', onKey);
                reset();
                return function() {
                    loop.stop();
                    document.removeEventListener('keydown', onKey);
                };
            }
        });

        /* ---------- BREAKOUT ---------- */
        registerGame('breakout', {
            name: 'Breakout', icon: '🧱', hsKey: 'chat-arc-hs-breakout',
            init: function(root) {
                /* TUNING — per 1/60s physics tick, frame-rate independent */
                var BALL_SPD = 3.0;    // base launch speed

                var W = 300, H = 360, COLS = 8, ROWS = 5, BR = 4.5;
                var PW_ = 54, PH = 9, PY = H - 26;
                var TOP = 40, BH = 14, GAP = 5, MX = 8;
                var BW = (W - MX*2 - GAP*(COLS-1)) / COLS;
                var cv = makeCanvas(root, W, H), ctx = cv.ctx;
                var bar = gameBar(root);
                var msg = gameMsg(root);
                msg.textContent = 'Drag to move · tap to launch';
                var accent = cssVar('--accent');
                var paddle, ball, bricks, score, lives, level, over, stuck;
                var hs = parseInt(localStorage.getItem(this.hsKey), 10) || 0;
                var keys = {};

                function upd() {
                    bar.innerHTML = '<span>Score ' + score + '</span><span>♥ ' + lives + '</span><span>Lv ' + level + '</span><span>Best ' + hs + '</span>';
                }
                function buildBricks() {
                    bricks = [];
                    for (var r = 0; r < ROWS; r++)
                        for (var c = 0; c < COLS; c++)
                            bricks.push({ x: MX + c*(BW + GAP), y: TOP + r*(BH + GAP), r: r, alive: true });
                }
                function resetBall() {
                    stuck = true;
                    ball = { x: W/2, y: PY - BR - 2, vx: 0, vy: 0 };
                }
                function newGame() {
                    loop.stop();
                    score = 0; lives = 3; level = 1; over = false;
                    paddle = { x: W/2 - PW_/2 };
                    buildBricks(); resetBall(); upd();
                    msg.textContent = 'Drag to move · tap to launch';
                    loop.start();
                }
                function serve() {
                    if (over) { newGame(); return; }
                    if (!stuck) return;
                    stuck = false;
                    var sp = BALL_SPD + level * 0.25;
                    ball.vx = (Math.random()*2 - 1) * 1.6;
                    ball.vy = -sp;
                }
                /* Physics: one fixed 1/60s tick */
                function physics() {
                    if (over) return;
                    if (keys.ArrowLeft) paddle.x -= 6.5;
                    if (keys.ArrowRight) paddle.x += 6.5;
                    paddle.x = Math.max(4, Math.min(W - PW_ - 4, paddle.x));

                    if (stuck) {
                        ball.x = paddle.x + PW_/2;
                        ball.y = PY - BR - 2;
                        return;
                    }
                    ball.x += ball.vx; ball.y += ball.vy;
                    if (ball.x < BR) { ball.x = BR; ball.vx = Math.abs(ball.vx); }
                    if (ball.x > W - BR) { ball.x = W - BR; ball.vx = -Math.abs(ball.vx); }
                    if (ball.y < BR) { ball.y = BR; ball.vy = Math.abs(ball.vy); }
                    if (ball.vy > 0 && ball.y + BR >= PY - 2 && ball.y - BR <= PY + PH + 8 &&
                        ball.x > paddle.x - BR && ball.x < paddle.x + PW_ + BR) {
                        var rel = (ball.x - (paddle.x + PW_/2)) / (PW_/2);
                        var sp = Math.min(7, Math.hypot(ball.vx, ball.vy) * 1.02);
                        var ang = rel * 1.05;
                        ball.vx = Math.sin(ang) * sp;
                        ball.vy = -Math.abs(Math.cos(ang) * sp);
                        ball.y = PY - BR;
                    }
                    if (ball.y > H + BR*2) {
                        lives--; upd();
                        if (lives <= 0) {
                            over = true;
                            if (score > hs) { hs = score; localStorage.setItem(GAMES.breakout.hsKey, hs); }
                            submitScore('breakout', score);
                            upd();
                        } else resetBall();
                        return;
                    }
                    for (var i = 0; i < bricks.length; i++) {
                        var b = bricks[i];
                        if (!b.alive) continue;
                        if (ball.x > b.x - BR && ball.x < b.x + BW + BR &&
                            ball.y > b.y - BR && ball.y < b.y + BH + BR) {
                            b.alive = false; score += 10; upd();
                            var ox = Math.min(ball.x - (b.x - BR), (b.x + BW + BR) - ball.x);
                            var oy = Math.min(ball.y - (b.y - BR), (b.y + BH + BR) - ball.y);
                            if (ox < oy) ball.vx *= -1; else ball.vy *= -1;
                            break;
                        }
                    }
                    var any = false;
                    for (var j = 0; j < bricks.length; j++) if (bricks[j].alive) { any = true; break; }
                    if (!any) {
                        level++; buildBricks(); resetBall(); upd();
                        msg.textContent = 'Level ' + level + ' — ball is faster now!';
                    }
                }
                function draw() {
                    ctx.fillStyle = '#0d0d0d'; ctx.fillRect(0, 0, W, H);
                    for (var i = 0; i < bricks.length; i++) {
                        var b = bricks[i];
                        if (!b.alive) continue;
                        ctx.globalAlpha = 1 - b.r * 0.16;
                        ctx.fillStyle = accent;
                        ctx.fillRect(b.x, b.y, BW, BH);
                    }
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = accent;
                    ctx.fillRect(paddle.x, PY, PW_, PH);
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(ball.x, ball.y, BR, 0, 7); ctx.fill();
                    ctx.textAlign = 'center';
                    if (stuck && !over) {
                        ctx.fillStyle = '#888'; ctx.font = '12px "DM Sans",sans-serif';
                        ctx.fillText('Tap or press Space to launch', W/2, H - 46);
                    }
                    if (over) {
                        ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
                        ctx.fillStyle = '#fff'; ctx.font = '700 22px "DM Sans",sans-serif';
                        ctx.fillText('Game Over', W/2, H/2 - 26);
                        ctx.font = '14px "DM Sans",sans-serif';
                        ctx.fillText('Score ' + score + '  ·  Best ' + hs, W/2, H/2);
                        ctx.fillStyle = '#888'; ctx.font = '12px "DM Sans",sans-serif';
                        ctx.fillText('Tap to play again', W/2, H/2 + 26);
                    }
                }
                var loop = fixedLoop(physics, draw, function() { return !over; });
                function onKey(e) {
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                        keys[e.key] = true; e.preventDefault();
                    } else if (e.key === ' ') {
                        e.preventDefault(); serve();
                    }
                }
                function onKeyUp(e) {
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') keys[e.key] = false;
                }
                function paddleFromPointer(e) {
                    var rect = cv.c.getBoundingClientRect();
                    var x = (e.clientX - rect.left) / rect.width * W;
                    paddle.x = Math.max(4, Math.min(W - PW_ - 4, x - PW_/2));
                }
                cv.c.addEventListener('pointermove', paddleFromPointer);
                cv.c.addEventListener('pointerdown', function(e) {
                    paddleFromPointer(e);
                    serve();
                });
                document.addEventListener('keydown', onKey);
                document.addEventListener('keyup', onKeyUp);
                newGame();
                return function() {
                    loop.stop();
                    document.removeEventListener('keydown', onKey);
                    document.removeEventListener('keyup', onKeyUp);
                };
            }
        });

        /* =============================================
           Mini-games modal framework
           ============================================= */
        var activeCleanup = null, curGame = null, gView = 'list';

        function setView(v) {
            gView = v;
            if (v !== 'lb') watchLbOff();
            var hasName = !!getUsername();
            $gBack.style.display = (v === 'game' || v === 'lb' || (v === 'name' && hasName)) ? 'flex' : 'none';
            $gLb.style.display = (v === 'list' || v === 'game') ? 'flex' : 'none';
            $gRestart.style.display = (v === 'game') ? 'flex' : 'none';
        }
        function gCleanup() {
            if (activeCleanup) { try { activeCleanup(); } catch (e) {} activeCleanup = null; }
        }

        /* --- Username screen --- */
        function showNameView() {
            gCleanup(); curGame = null;
            setView('name');
            $gTitle.textContent = '👤 Your profile';
            $gBody.innerHTML = '';

            var ico = document.createElement('div');
            ico.className = 'r-ico';
            ico.style.margin = '4px auto 16px';
            ico.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
            $gBody.appendChild(ico);

            var sub = document.createElement('div');
            sub.className = 'g-msg';
            sub.style.margin = '0 0 14px';
            sub.textContent = fbOn()
                ? 'Pick a display name — your scores go on the global leaderboard under it.'
                : 'Pick a display name — your scores are saved under it.';
            $gBody.appendChild(sub);

            var form = document.createElement('div');
            form.className = 'name-form';
            var inp = document.createElement('input');
            inp.type = 'text';
            inp.maxLength = 16;
            inp.placeholder = 'Username';
            inp.value = getUsername();
            inp.autocomplete = 'off';
            inp.spellcheck = false;
            form.appendChild(inp);

            var err = document.createElement('div');
            err.className = 'name-err';
            form.appendChild(err);

            var save = document.createElement('button');
            save.className = 'go-btn';
            save.textContent = getUsername() ? 'Save name' : 'Start playing';
            form.appendChild(save);
            $gBody.appendChild(form);

            function doSave() {
                var v = inp.value.replace(/\s+/g, ' ').trim();
                if (!v) {
                    err.textContent = 'Please enter a name.';
                    inp.classList.add('shake');
                    setTimeout(function() { inp.classList.remove('shake'); }, 450);
                    return;
                }
                setUsername(v);
                toast('Playing as ' + v);
                showGameList();
            }
            save.addEventListener('click', doSave);
            inp.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') doSave();
                e.stopPropagation();
            });
            inp.addEventListener('input', function() { err.textContent = ''; });
            setTimeout(function() { inp.focus(); }, 150);
        }

        /* --- Game list --- */
        function showGameList() {
            gCleanup(); curGame = null;
            setView('list');
            $gTitle.textContent = 'Mini Games';
            $gBody.innerHTML = '';

            var grid = document.createElement('div');
            grid.className = 'game-grid';
            Object.keys(GAMES).forEach(function(id) {
                var g = GAMES[id];
                var t = document.createElement('div');
                t.className = 'game-tile';
                var hsTxt = '';
                if (g.hsKey) hsTxt = 'Best ' + (parseInt(localStorage.getItem(g.hsKey), 10) || 0);
                t.innerHTML =
                    '<div class="g-ico">' + g.icon + '</div>' +
                    '<div class="g-name">' + g.name + '</div>' +
                    '<div class="g-hs">' + (hsTxt || '&nbsp;') + '</div>';
                t.addEventListener('click', function() { startGame(id); });
                grid.appendChild(t);
            });
            $gBody.appendChild(grid);

            var actions = document.createElement('div');
            actions.className = 'list-actions';
            var lbBtn = document.createElement('button');
            lbBtn.className = 'g-btn';
            lbBtn.textContent = fbOn() ? '🏆 Global leaderboard' : '🏆 Leaderboard';
            lbBtn.addEventListener('click', showLeaderboard);
            actions.appendChild(lbBtn);
            $gBody.appendChild(actions);

            var hint = gameMsg($gBody);
            hint.textContent = fbOn()
                ? 'Live global scores · playing as "' + (getUsername() || 'Guest') + '" · tap here to change name'
                : 'Scores saved on this device · playing as "' + (getUsername() || 'Guest') + '" · tap here to change name';
            hint.style.cursor = 'pointer';
            hint.style.textDecoration = 'underline';
            hint.addEventListener('click', showNameView);
        }

        /* --- Leaderboard (live, global via Firebase) --- */
        function showLeaderboard() {
            gCleanup(); curGame = null;
            setView('lb');
            $gTitle.textContent = '🏆 Leaderboard';
            $gBody.innerHTML = '';

            var chips = document.createElement('div');
            chips.className = 'chip-row';
            var wrap = document.createElement('div');
            var curId = LB_ORDER[0];

            LB_ORDER.forEach(function(id) {
                var g = GAMES[id];
                var c = document.createElement('button');
                c.className = 'lb-chip';
                c.textContent = g.icon + ' ' + g.name;
                c.addEventListener('click', function() {
                    curId = id;
                    var all = chips.children;
                    for (var k = 0; k < all.length; k++) all[k].classList.toggle('sel', LB_ORDER[k] === id);
                    watchLb(id, renderList);
                });
                chips.appendChild(c);
            });
            $gBody.appendChild(chips);
            $gBody.appendChild(wrap);

            var note = gameMsg($gBody);

            function renderList(data, live) {
                var g = GAMES[curId];
                wrap.innerHTML = '';

                var nb = document.createElement('div');
                nb.className = 'lb-note';
                nb.innerHTML = live
                    ? '<span class="lb-live">● LIVE</span> · global · top 100 · ' + (g.lbLower ? 'fewer is better' : 'higher is better')
                    : 'Offline — showing this device\u2019s scores only';
                wrap.appendChild(nb);

                var localCount = (localLb()[curId] || []).filter(function(e) { return e && e.s > 0; }).length;
                if (live && !data.length && localCount > 0) {
                    var mig = document.createElement('button');
                    mig.className = 'g-btn';
                    mig.style.margin = '0 0 10px';
                    mig.textContent = '⬆ Upload my ' + localCount + ' local score' + (localCount > 1 ? 's' : '') + ' to global';
                    mig.addEventListener('click', function() {
                        migrateLocal(curId);
                        mig.disabled = true;
                        mig.textContent = 'Uploading…';
                    });
                    wrap.appendChild(mig);
                }

                if (!data.length) {
                    var empty = document.createElement('div');
                    empty.className = 'bm-empty';
                    empty.textContent = live
                        ? 'No global scores yet — play a round to claim rank #1!'
                        : 'No scores yet — play a round!';
                    wrap.appendChild(empty);
                    return;
                }

                var me = getUsername();
                data.forEach(function(e, idx) {
                    var row = document.createElement('div');
                    row.className = 'lb-row' + (idx < 3 ? ' top' : '') + (e.n === me ? ' me' : '');
                    var rk = document.createElement('span');
                    rk.className = 'lb-rank';
                    rk.textContent = idx < 3 ? ['🥇','🥈','🥉'][idx] : (idx + 1);
                    var nm = document.createElement('span');
                    nm.className = 'lb-name';
                    nm.textContent = String(e.n || 'Guest');
                    var sc = document.createElement('span');
                    sc.className = 'lb-score';
                    sc.textContent = e.s;
                    var dt = document.createElement('span');
                    dt.className = 'lb-date';
                    dt.textContent = fmtDate(e.t);
                    row.appendChild(rk); row.appendChild(nm); row.appendChild(sc); row.appendChild(dt);
                    wrap.appendChild(row);
                });
            }

            chips.children[0].classList.add('sel');
            watchLb(curId, renderList);
            note.textContent = fbOn()
                ? 'Connected — scores update in real time for everyone.'
                : 'Not connected — add your Firebase config to enable the global board.';
        }

        /* --- Start / close a game --- */
        function startGame(id) {
            gCleanup();
            curGame = id;
            setView('game');
            var g = GAMES[id];
            $gTitle.textContent = g.icon + ' ' + g.name;
            $gBody.innerHTML = '';
            activeCleanup = g.init($gBody) || null;
        }
        function closeGames() {
            gCleanup(); curGame = null;
            setView('none');
            $gModal.style.display = 'none';
        }

        $gameB.addEventListener('click', function() {
            $gModal.style.display = 'flex';
            if (!getUsername()) showNameView();
            else showGameList();
        });
        $gBack.addEventListener('click', showGameList);
        $gLb.addEventListener('click', function() {
            if (!getUsername()) showNameView();
            else showLeaderboard();
        });
        $gRestart.addEventListener('click', function() { if (curGame) startGame(curGame); });
        $gClose.addEventListener('click', closeGames);
        $gModal.addEventListener('click', function(e) {
            if (e.target === $gModal) closeGames();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && $gModal.style.display === 'flex') closeGames();
        });
        /* ================== END MINI GAMES ================== */
    </script>
